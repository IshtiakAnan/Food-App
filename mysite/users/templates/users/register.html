{% extends 'food/base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-5 py-10 bg-[#f8f9fa]">
    <div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">Create an Account</h1>
        <p class="text-sm text-gray-500 text-center mb-8">Sign up to start adding your favorite dishes.</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-xs font-semibold uppercase tracking-wide text-red-600 mb-2">
                    {{ field.label }}
                </label>
                <div class="[&_input]:w-full [&_input]:px-4 [&_input]:py-3 [&_input]:border [&_input]:border-gray-200 [&_input]:rounded-md [&_input]:text-base [&_input]:bg-white [&_input]:focus:outline-none [&_input]:focus:border-red-500 [&_input]:focus:ring-2 [&_input]:focus:ring-red-100">
                    {{ field }}
                </div>
                <!-- {% if field.help_text %}
                <hp class="text-gray-400 text-xs mt-1">{{ field.help_text }}</hp>
                {% endif %} -->
                {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4">
                <button type="submit" class="w-full bg-gray-800 text-white py-3.5 rounded-md text-base font-semibold hover:bg-red-600 transition-colors duration-300 cursor-pointer">
                    Sign Up
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
