{% extends 'food/base.html' %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-5 py-10 bg-[#f8f9fa]">
	<div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-lg border border-gray-100 text-center">
		<div class="mx-auto mb-5 h-16 w-16 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
			<svg class="w-8 h-8" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
				<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12.5 9.2 17 19 7"/>
			</svg>
		</div>

		<h1 class="text-3xl font-bold text-gray-800 mb-2">You have been logged out</h1>
		<p class="text-sm text-gray-500">Thanks for visiting. You can log back in any time.</p>

		<div class="mt-8 flex flex-col sm:flex-row gap-3 items-center sm:justify-center">
			<a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-md bg-gray-800 text-white font-semibold px-5 py-3 hover:bg-red-600 transition-colors duration-300">
				Log In Again
			</a>
			<a href="{% url 'food:index' %}" class="inline-flex items-center justify-center rounded-md border border-gray-200 text-gray-700 font-semibold px-5 py-3 hover:border-red-300 hover:text-red-600 transition-colors duration-300">
				Back to Home
			</a>
		</div>
	</div>
</div>
{% endblock %}
