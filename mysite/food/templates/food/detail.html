{% extends 'food/base.html' %}

{% block title %}{{ item_info.item_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col md:flex-row md:space-x-8">
        <!-- Image -->
        <div class="md:w-1/3">
            <img src="{{ item_info.item_image.url }}" alt="{{ item_info.item_name }}" class="w-full h-auto rounded-lg shadow-md object-cover">
        </div>
        <!-- Details -->
        <div class="mt-6 md:mt-0 md:w-2/3">
            <h1 class="text-3xl font-bold text-gray-900">{{ item_info.item_name }}</h1>
            <p class="mt-4 text-gray-600">{{ item_info.item_desc }}</p>
            <p class="mt-2 text-2xl font-semibold text-indigo-600">${{ item_info.item_price }}</p>
            <div>
                <!-- Update Button -->
                <a href="{% url 'food:update_item' item_info.id %}" class="inline-block mt-6 bg-gray-800 text-white py-3.5 px-6 rounded-md text-base font-semibold hover:bg-red-600 transition-colors duration-300 cursor-pointer">
                    Update Item
                </a>
                <!-- Delete Button -->
                <a href="{% url 'food:delete_item' item_info.id %}" class="inline-block mt-6 bg-red-600 text-white py-3.5 px-6 rounded-md text-base font-semibold hover:bg-red-700 transition-colors duration-300 cursor-pointer">
                    Delete Item
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
