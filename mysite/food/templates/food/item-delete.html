{% extends 'food/base.html' %}

{% block title %}Delete {{ item.item_name }}{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-5 py-10 bg-[#f8f9fa]">
    <div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-lg border border-gray-100 text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Delete Item</h1>
        <p class="text-gray-500 mb-8">Are you sure you want to delete <span class="font-semibold text-red-600">{{ item.item_name }}</span>?</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 text-white py-3.5 rounded-md text-base font-semibold hover:bg-red-700 transition-colors duration-300 cursor-pointer">
                Yes, Delete
            </button>
        </form>
        <a href="{% url 'food:details' item.id %}" class="inline-block mt-4 w-full bg-gray-800 text-white py-3.5 rounded-md text-base font-semibold hover:bg-gray-700 transition-colors duration-300 cursor-pointer">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
