{% extends 'food/base.html' %}

{% block title %}Food Items{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    <ul>
    {% for item in item_list %}
    <li>
        <a href="{% url 'food:details' item.id %}" class="flex items-center">
            <img src="{{ item.item_image.url }}" alt="{{ item.item_name }}" class="w-12 h-12 rounded-full object-cover mr-4 shrink-0">
            <div>
                <span class="item-name">{{ item.item_name }}</span>
                <span class="item-desc">{{ item.item_desc }}</span>
            </div>
        </a>
    </li>
    {% endfor %}
    </ul>
</div>
{% endblock %}
